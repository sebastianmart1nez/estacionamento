<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veículos — ParkSystem</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <header class="page-header">
        <div>
            <h1>Gestão de Veículos</h1>
            <p class="subtitle">Controlo de entradas e saídas</p>
        </div>
    </header>

    <section class="stats-grid">
        <div class="stat-card green">
            <div class="stat-icon">✅</div>
            <div>
                <p class="stat-label">Vagas Disponíveis</p>
                <h2 class="stat-value" th:text="${vagasDisponiveis}">0</h2>
            </div>
        </div>
        <div class="stat-card orange">
            <div class="stat-icon">🚗</div>
            <div>
                <p class="stat-label">Vagas Ocupadas</p>
                <h2 class="stat-value" th:text="${vagasOcupadas}">0</h2>
            </div>
        </div>
        <div class="stat-card blue">
            <div class="stat-icon">📊</div>
            <div>
                <p class="stat-label">Veículos Hoje</p>
                <h2 class="stat-value" th:text="${veiculosHoje}">0</h2>
            </div>
        </div>
        <div class="stat-card purple">
            <div class="stat-icon">€</div>
            <div>
                <p class="stat-label">Receita Estimada</p>
                <h2 class="stat-value" th:text="${receitaHoje} + '€'">0.00€</h2>
            </div>
        </div>
    </section>

    <section class="card form-card">
        <h3>Registar Entrada de Veículo</h3>
        <form action="/veiculos" method="post" class="form-inline">
            <div class="form-group">
                <label>Matrícula</label>
                <input type="text" name="matricula" placeholder="00-AA-00" required>
            </div>
            <div class="form-group">
                <label>Hora de Entrada</label>
                <input type="datetime-local" name="horaEntrada" required>
            </div>
            <button type="submit" class="btn-primary">Registar</button>
        </form>
    </section>

    <section class="card">
        <h3>Veículos Registados</h3>
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Matrícula</th>
                    <th>Hora de Entrada</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${lista}">
                    <td th:text="${v.id}"></td>
                    <td th:text="${v.matricula}"></td>
                    <td th:text="${v.horaEntrada}"></td>
                    <td>
                        <form th:action="@{/veiculos/eliminar/{id}(id=${v.id})}"
                              method="post" style="display:inline"
                              onsubmit="return confirm('Remover este veículo?')">
                            <button type="submit" class="btn-danger btn-sm">Remover</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(lista)}">
                    <td colspan="4" class="empty-row">Nenhum veículo registado.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
