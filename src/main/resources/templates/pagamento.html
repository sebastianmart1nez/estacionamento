<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamentos — ParkSystem</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <header class="page-header">
        <div>
            <h1>Gestão de Pagamentos</h1>
            <p class="subtitle">Controlo financeiro do estacionamento</p>
        </div>
    </header>

    <section class="stats-grid">
        <div class="stat-card green">
            <div class="stat-icon">€</div>
            <div>
                <p class="stat-label">Total Pagamentos</p>
                <h2 class="stat-value" th:text="${totalPagamentos}">0</h2>
            </div>
        </div>
        <div class="stat-card orange">
            <div class="stat-icon">📈</div>
            <div>
                <p class="stat-label">Receita Hoje</p>
                <h2 class="stat-value" th:text="${receitaHoje} + '€'">0.00€</h2>
            </div>
        </div>
        <div class="stat-card blue">
            <div class="stat-icon">📊</div>
            <div>
                <p class="stat-label">Valor Médio</p>
                <h2 class="stat-value" th:text="${valorMedio} + '€'">0.00€</h2>
            </div>
        </div>
    </section>

    <section class="card form-card">
        <h3>Registar Pagamento</h3>
        <form action="/pagamentos" method="post" class="form-inline">
            <div class="form-group">
                <label>Matrícula</label>
                <input type="text" name="matricula" placeholder="00-AA-00" required>
            </div>
            <div class="form-group">
                <label>Valor (€)</label>
                <input type="number" name="valor" placeholder="0.00"
                       step="0.01" min="0" required>
            </div>
            <div class="form-group">
                <label>Método de Pagamento</label>
                <select name="metodoPagamento" required>
                    <option value="" disabled selected>Selecionar método</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Cartão">Cartão</option>
                    <option value="MBWay">MBWay</option>
                    <option value="Transferência">Transferência</option>
                </select>
            </div>
            <button type="submit" class="btn-primary">Registar</button>
        </form>
    </section>

    <section class="card">
        <h3>Histórico de Pagamentos</h3>
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Matrícula</th>
                    <th>Valor</th>
                    <th>Método</th>
                    <th>Data</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${lista}">
                    <td th:text="${p.idPagamento}"></td>
                    <td th:text="${p.matricula}"></td>
                    <td th:text="${p.valor} + '€'"></td>
                    <td th:text="${p.metodoPagamento}"></td>
                    <td th:text="${p.dataPagamento}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(lista)}">
                    <td colspan="5" class="empty-row">Nenhum pagamento registado.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
